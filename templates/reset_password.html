<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stockly - Recuperar Contraseña</title>
  <style>
    :root {
      --bg: #0b0f12;
      --card: #0f1720;
      --accent: #544ee8;
      --muted: #94a3b8;
      --text: #e6f0f6;
      --glass: rgba(255,255,255,0.03);
      --border: rgba(255,255,255,0.04);
      --danger: #ff6b6b;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      font-family: Inter, system-ui, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ── Abstract background scene ──────────────── */
    .bg-scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: radial-gradient(ellipse 120% 80% at 60% -10%, #0d0b1e 0%, var(--bg) 55%);
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(1px);
      animation: float linear infinite;
      will-change: transform;
    }

    .orb-1 {
      width: 420px; height: 420px;
      top: -100px; left: -80px;
      background: radial-gradient(circle at 35% 35%,
        rgba(84, 78, 232, 0.10) 0%,
        rgba(60, 50, 180, 0.06) 40%,
        transparent 70%);
      border: 1px solid rgba(84, 78, 232, 0.07);
      animation-duration: 22s;
      animation-delay: 0s;
    }
    .orb-2 {
      width: 560px; height: 560px;
      top: 30%; right: -180px;
      background: radial-gradient(circle at 60% 40%,
        rgba(84, 78, 232, 0.08) 0%,
        rgba(120, 80, 220, 0.05) 45%,
        transparent 70%);
      border: 1px solid rgba(100, 80, 220, 0.06);
      animation-duration: 30s;
      animation-delay: -8s;
    }
    .orb-3 {
      width: 300px; height: 300px;
      bottom: -60px; left: 25%;
      background: radial-gradient(circle at 50% 50%,
        rgba(60, 40, 160, 0.10) 0%,
        rgba(84, 78, 232, 0.05) 50%,
        transparent 70%);
      border: 1px solid rgba(84, 78, 232, 0.06);
      animation-duration: 18s;
      animation-delay: -5s;
    }

    .panel {
      position: absolute;
      border-radius: 28px;
      backdrop-filter: blur(0px);
      animation: drift linear infinite;
      will-change: transform;
    }
    .panel-1 {
      width: 220px; height: 320px;
      top: 12%; left: 8%;
      background: linear-gradient(135deg,
        rgba(255,255,255,0.025) 0%,
        rgba(84, 78, 232, 0.025) 50%,
        transparent 100%);
      border: 1px solid rgba(255,255,255,0.045);
      transform: rotate(-18deg);
      animation-duration: 26s;
      animation-delay: -3s;
    }

    .line {
      position: absolute;
      background: linear-gradient(90deg, transparent, rgba(84, 78, 232, 0.18), transparent);
      height: 1px;
      animation: slideLine linear infinite;
    }
    .line-1 { width: 500px; top: 28%; left: -100px; animation-duration: 20s; animation-delay: 0s; transform: rotate(-6deg); }

    .dot {
      position: absolute;
      border-radius: 50%;
      background: rgba(124, 118, 255, 0.22);
      animation: blink ease-in-out infinite;
    }
    .dot-1 { width: 5px; height: 5px; top: 20%; left: 30%; animation-duration: 4s; animation-delay: 0s; }

    @keyframes float {
      0%   { transform: translateY(0px) translateX(0px); }
      25%  { transform: translateY(-18px) translateX(10px); }
      50%  { transform: translateY(-8px) translateX(20px); }
      75%  { transform: translateY(-24px) translateX(5px); }
      100% { transform: translateY(0px) translateX(0px); }
    }
    @keyframes drift {
      0%   { transform: rotate(-18deg) translateY(0); }
      33%  { transform: rotate(-18deg) translateY(-14px); }
      66%  { transform: rotate(-18deg) translateY(-6px); }
      100% { transform: rotate(-18deg) translateY(0); }
    }
    @keyframes slideLine {
      0%   { opacity: 0.4; transform: translateX(0) rotate(-6deg); }
      50%  { opacity: 0.8; transform: translateX(40px) rotate(-6deg); }
      100% { opacity: 0.4; transform: translateX(0) rotate(-6deg); }
    }
    @keyframes blink {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50%       { opacity: 0.8; transform: scale(1.4); }
    }

    header { display: none; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 0.65rem 1rem;
      border-radius: 10px;
      font-size: 0.9rem; font-weight: 700;
      border: none; cursor: pointer;
      transition: transform .08s ease, filter .12s ease, box-shadow .12s ease;
      text-decoration: none;
      width: 100%;
      background: linear-gradient(180deg, #544ee8, #3f3ab8);
      color: #fff;
      box-shadow: 0 4px 16px rgba(84, 78, 232, 0.35);
    }
    .btn:hover { filter: brightness(1.08); box-shadow: 0 6px 22px rgba(84, 78, 232, 0.45); }
    .btn:active { transform: translateY(1px); }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .card {
      background: linear-gradient(145deg,
        rgba(15,23,32,0.92) 0%,
        rgba(10,16,24,0.96) 100%);
      padding: 2rem;
      border-radius: 16px;
      box-shadow:
        0 0 0 1px rgba(84, 78, 232, 0.12),
        0 8px 32px rgba(0,0,0,0.55),
        0 2px 8px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.045);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .card::before {
      content: '';
      display: block;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(84, 78, 232, 0.35), transparent);
      margin: -2rem -2rem 1.75rem;
    }

    .text-muted {
      color: var(--muted);
    }

    .field {
      display: block; margin: 0.85rem 0;
    }
    .field .label {
      display: block; color: var(--muted);
      font-size: 0.78rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.06em;
      margin-bottom: 7px;
    }
    .field input {
      width: 100%;
      padding: 0.7rem 0.85rem;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      color: var(--text);
      border-radius: 10px;
      font-size: 0.925rem;
      transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .field input:focus {
      outline: none;
      border-color: rgba(84, 78, 232, 0.55);
      background: rgba(84, 78, 232, 0.05);
      box-shadow: 0 0 0 3px rgba(84, 78, 232, 0.14);
    }
    .field input::placeholder { color: rgba(148,163,184,0.45); }

    /* ── Password visibility toggle ──────────── */
    .password-field {
      position: relative;
      display: block;
    }
    .password-field input {
      padding-right: 2.5rem;
    }
    .password-toggle {
      position: absolute;
      right: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 0.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: color .15s ease;
    }
    .password-toggle:hover {
      color: #7c77f0;
    }

    .form-actions {
      margin-top: 1.5rem;
    }

    .auth-container {
      position: relative; z-index: 10;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
    }

    .auth-card h2 {
      margin: 0 0 0.35rem 0;
      font-size: 1.45rem; font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
    }
    .auth-card p {
      margin: 0 0 1.5rem 0;
      color: var(--muted); font-size: 0.875rem;
    }

    .back-link {
      text-align: center; margin-top: 1.25rem;
      font-size: 0.875rem; color: var(--muted);
    }
    .back-link a {
      color: #7c77f0; text-decoration: none;
      cursor: pointer; font-weight: 600;
      transition: opacity .15s ease;
    }
    .back-link a:hover { opacity: 0.8; text-decoration: underline; }

    .alert {
      padding: 0.7rem 0.9rem;
      border-radius: 8px; margin-bottom: 1rem;
      font-size: 0.875rem;
    }
    .alert-error {
      background: rgba(255,107,107,0.08);
      border: 1px solid rgba(255,107,107,0.25);
      color: var(--danger);
    }
    .alert-success {
      background: rgba(84, 78, 232, 0.08);
      border: 1px solid rgba(84, 78, 232, 0.25);
      color: #544ee8;
    }

    @media (max-width: 600px) {
      .auth-container { padding: 12px; }
      .card { padding: 1.5rem; }
      .card::before { margin: -1.5rem -1.5rem 1.5rem; }
    }
  </style>
</head>

<body>
  <!-- ── Abstract background scene ──────────────── -->
  <div class="bg-scene" aria-hidden="true">
    <!-- Orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <!-- Glass panel -->
    <div class="panel panel-1"></div>
    <!-- Line accents -->
    <div class="line line-1"></div>
    <!-- Dots -->
    <div class="dot dot-1"></div>
  </div>

  <div class="auth-container">
    <div class="auth-card">
      <div class="card">
        <h2>Recuperar contraseña</h2>
        <p class="text-muted">Ingresa tu correo electrónico asociado a tu cuenta y te enviaremos un codigo para
          restablecer tu contraseña.</p>

        <form id="reset-form">
          <div class="field">
            <label class="label" for="reset-email">Email</label>
            <input type="email" id="reset-email" name="email" required placeholder="tu@email.com" max="{{Limits.USER_EMAIL_MAX}}">
          </div>

          <div class="form-actions">
            <button type="submit" class="btn" id="submit-btn">Enviar codigo</button>
          </div>
        </form>

        <form id="code-form" style="display:none;">
          <div class="field">
            <label class="label" for="reset-code">Código recibido</label>
            <input type="text" id="reset-code" name="code" maxlength="{{Limits.USER_CODE_MAX}}" required placeholder="Ingresa el código">
          </div>
          <div class="form-actions">
            <button type="submit" class="btn" id="code-btn">Validar código</button>
          </div>
        </form>

        <form id="newpass-form" style="display:none;">
          <div class="field">
            <label class="label" for="new-password">Nueva contraseña</label>
            <div class="password-field">
              <input type="password" id="new-password" maxlength="{{Limits.USER_PASSWORD_MAX}}" name="new_password" required placeholder="Nueva contraseña" oninput="validatePasswordReset()">
              <button type="button" class="password-toggle" onclick="togglePasswordVisibility('new-password')">
                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
          </div>
          <div class="field">
            <label class="label" for="confirm-password">Confirmar contraseña</label>
            <div class="password-field">
              <input type="password" id="confirm-password" maxlength="{{Limits.USER_PASSWORD_MAX}}" name="confirm_password" required placeholder="Confirmar contraseña" oninput="validatePasswordReset()">
              <button type="button" class="password-toggle" onclick="togglePasswordVisibility('confirm-password')">
                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
            <div class="field-error" id="password-error-reset">Las contraseñas no coinciden</div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn" id="newpass-btn">Cambiar contraseña</button>
          </div>
        </form>

        <div class="back-link">
          <a href="{{ url_for('auth.login') }}">← Volver al inicio de sesión</a>
        </div>
      </div>
    </div>
  </div>
  <script src="{{ url_for('static', filename='js/auth-reset.js') }}"></script>
  
  <script>
    // ════════════════════════════════════════════════════
    // Password visibility toggle and validation
    // ════════════════════════════════════════════════════

    function togglePasswordVisibility(fieldId) {
      const field = document.getElementById(fieldId);
      const button = event.target.closest('.password-toggle');
      
      if (field.type === 'password') {
        field.type = 'text';
        button.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
      } else {
        field.type = 'password';
        button.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
      }
    }

    function validatePasswordReset() {
      const password = document.getElementById('new-password');
      const confirm = document.getElementById('confirm-password');
      const error = document.getElementById('password-error-reset');

      if (password.value && confirm.value) {
        if (password.value === confirm.value) {
          error.classList.remove('show');
          confirm.style.borderColor = 'rgba(255,255,255,0.07)';
        } else {
          error.classList.add('show');
          confirm.style.borderColor = 'rgba(255,107,107,0.5)';
        }
      } else {
        error.classList.remove('show');
        confirm.style.borderColor = 'rgba(255,255,255,0.07)';
      }
    }

    // Validate passwords match before form submission
    document.getElementById('newpass-form').addEventListener('submit', function(e) {
      const password = document.getElementById('new-password').value;
      const confirm = document.getElementById('confirm-password').value;

      if (password !== confirm) {
        e.preventDefault();
        validatePasswordReset();
        alert('Las contraseñas no coinciden');
      }
    });
  </script>

</html>
