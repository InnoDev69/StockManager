<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Manager - Recuperar Contraseña</title>
    <style>
        :root{
          --bg: #0b0f12;
          --card: #0f1720;
          --accent: #00d1ff;
          --muted: #94a3b8;
          --text: #e6f0f6;
          --glass: rgba(255,255,255,0.03);
          --border: rgba(255,255,255,0.04);
          --danger: #ff6b6b;
        }
        html,body{
          height:100%;
          margin:0;
          font-family: Inter, system-ui, Arial, sans-serif;
          background: linear-gradient(180deg,var(--bg), #081018 80%);
          color:var(--text);
          -webkit-font-smoothing:antialiased;
          -moz-osx-font-smoothing:grayscale;
        }
        .header-inner{
          display:flex;
          align-items:center;
          gap:1rem;
          max-width:980px;
          margin:0 auto;
        }
        header{
          background: linear-gradient(90deg, rgba(255,255,255,0.01), rgba(255,255,255,0.02));
          padding:1rem 1.5rem;
          border-bottom:1px solid var(--border);
          backdrop-filter: blur(6px);
        }
        h1{
          margin:0;
          font-size:1.125rem;
          color:var(--accent);
          letter-spacing:0.2px;
        }
        .btn{
          display:inline-block;
          padding:0.45rem 0.8rem;
          border-radius:8px;
          background:var(--accent);
          color:#041018;
          font-weight:600;
          text-decoration:none;
          border: none;
          cursor: pointer;
          transition: transform .08s ease, box-shadow .08s ease, opacity .12s ease;
          width: 100%;
          text-align: center;
        }
        .btn:hover{
          opacity: 0.9;
        }
        .btn:active{ 
          transform: translateY(1px);
        }
        .btn:disabled{
          opacity: 0.6;
          cursor: not-allowed;
        }
        .text-muted{ 
          color:var(--muted);
        }
        .card{
          background: linear-gradient(180deg, var(--card), rgba(15,23,32,0.98));
          padding:1.5rem;
          border-radius:10px;
          box-shadow: 0 6px 18px rgba(2,6,23,0.6);
          border: 1px solid var(--glass);
        }
        .field{ 
          display:block;
          margin:0.8rem 0;
        }
        .field .label{ 
          display:block;
          color:var(--muted);
          font-size:0.875rem;
          margin-bottom:6px;
          font-weight: 500;
        }
        .field input{
          width:100%;
          padding:0.7rem;
          background:transparent;
          border:1px solid var(--glass);
          color:var(--text);
          border-radius:8px;
          font-size:0.95rem;
          box-sizing: border-box;
        }
        .field input:focus{
          outline: none;
          border-color: var(--accent);
          box-shadow: 0 0 0 2px rgba(0,209,255,0.1);
        }
        .form-actions{ 
          margin-top:1.5rem;
        }
        .auth-container{
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: calc(100vh - 80px);
          padding: 20px;
        }
        .auth-card{
          width: 100%;
          max-width: 420px;
        }
        .auth-card h2{
          margin: 0 0 0.5rem 0;
          font-size: 1.5rem;
          color: var(--text);
        }
        .auth-card p{
          margin: 0 0 1.5rem 0;
          color: var(--muted);
          font-size: 0.9rem;
          line-height: 1.5;
        }
        .back-link{
          text-align: center;
          margin-top: 1.5rem;
          font-size: 0.9rem;
        }
        .back-link a{
          color: var(--muted);
          text-decoration: none;
          cursor: pointer;
          transition: color 0.2s;
        }
        .back-link a:hover{
          color: var(--accent);
          text-decoration: underline;
        }
        .alert{
          padding: 0.75rem;
          border-radius: 8px;
          margin-bottom: 1rem;
          font-size: 0.9rem;
        }
        .alert-error{
          background: rgba(255,107,107,0.1);
          border: 1px solid rgba(255,107,107,0.3);
          color: var(--danger);
        }
        .alert-success{
          background: rgba(0,209,255,0.1);
          border: 1px solid rgba(0,209,255,0.3);
          color: var(--accent);
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <h1>Stock Manager</h1>
        </div>
    </header>

    <div class="auth-container">
        <div class="auth-card">
            <div class="card">
                <h2>Recuperar contraseña</h2>
                <p class="text-muted">Ingresa tu correo electrónico asociado a tu cuenta y te enviaremos un codigo para restablecer tu contraseña.</p>
                
                <form id="reset-form">
                    <div class="field">
                        <label class="label" for="reset-email">Email</label>
                        <input type="email" id="reset-email" name="email" required placeholder="tu@email.com">
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" class="btn" id="submit-btn">Enviar codigo</button>
                    </div>
                </form>

                <div class="back-link">
                    <a href="{{ url_for('login') }}">← Volver al inicio de sesión</a>
                </div>
            </div>
        </div>
    </div>
    <script>
    function deleteAlert() {
        const alert = document.querySelector('.alert');
        if (alert) {
            alert.remove();
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('reset-form');
        const emailInput = document.getElementById('reset-email');
        const submitBtn = document.getElementById('submit-btn');
        
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Enviando...';
            
            try {
                const response = await fetch('/api/users/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: email })
                });
                
                const data = await response.json();
                
                document.querySelectorAll('.alert').forEach(alert => alert.remove());
                
                if (response.ok) {
                    const successAlert = document.createElement('div');
                    successAlert.className = 'alert alert-success';
                    successAlert.textContent = data.message;
                    form.parentNode.insertBefore(successAlert, form);
                    
                    emailInput.value = '';
                } else {
                    const errorAlert = document.createElement('div');
                    errorAlert.className = 'alert alert-error';
                    errorAlert.textContent = data.error || 'Error al procesar la solicitud';
                    form.parentNode.insertBefore(errorAlert, form);
                }
            } catch (error) {
                deleteAlert();
                const errorAlert = document.createElement('div');
                errorAlert.className = 'alert alert-error';
                errorAlert.textContent = 'Error de conexión. Intenta nuevamente.';
                form.parentNode.insertBefore(errorAlert, form);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Enviar codigo';
            }
        });
    });
    </script>
</body>
</html>
