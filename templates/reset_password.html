<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stockly - Recuperar Contraseña</title>
  <style>
    :root {
      --bg: #0b0f12;
      --card: #0f1720;
      --accent: #00d1ff;
      --muted: #94a3b8;
      --text: #e6f0f6;
      --glass: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.04);
      --danger: #ff6b6b;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      font-family: Inter, system-ui, Arial, sans-serif;
      background: linear-gradient(180deg, var(--bg), #081018 80%);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .header-inner {
      display: flex;
      align-items: center;
      gap: 1rem;
      max-width: 980px;
      margin: 0 auto;
    }

    header {
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.01), rgba(255, 255, 255, 0.02));
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(6px);
    }

    h1 {
      margin: 0;
      font-size: 1.125rem;
      color: var(--accent);
      letter-spacing: 0.2px;
    }

    .btn {
      display: inline-block;
      padding: 0.45rem 0.8rem;
      border-radius: 8px;
      background: var(--accent);
      color: #041018;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: transform .08s ease, box-shadow .08s ease, opacity .12s ease;
      width: 100%;
      text-align: center;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .text-muted {
      color: var(--muted);
    }

    .card {
      background: linear-gradient(180deg, var(--card), rgba(15, 23, 32, 0.98));
      padding: 1.5rem;
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(2, 6, 23, 0.6);
      border: 1px solid var(--glass);
    }

    .field {
      display: block;
      margin: 0.8rem 0;
    }

    .field .label {
      display: block;
      color: var(--muted);
      font-size: 0.875rem;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .field input {
      width: 100%;
      padding: 0.7rem;
      background: transparent;
      border: 1px solid var(--glass);
      color: var(--text);
      border-radius: 8px;
      font-size: 0.95rem;
      box-sizing: border-box;
    }

    .field input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(0, 209, 255, 0.1);
    }

    .form-actions {
      margin-top: 1.5rem;
    }

    .auth-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 80px);
      padding: 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
    }

    .auth-card h2 {
      margin: 0 0 0.5rem 0;
      font-size: 1.5rem;
      color: var(--text);
    }

    .auth-card p {
      margin: 0 0 1.5rem 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .back-link {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.9rem;
    }

    .back-link a {
      color: var(--muted);
      text-decoration: none;
      cursor: pointer;
      transition: color 0.2s;
    }

    .back-link a:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .alert {
      padding: 0.75rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }

    .alert-error {
      background: rgba(255, 107, 107, 0.1);
      border: 1px solid rgba(255, 107, 107, 0.3);
      color: var(--danger);
    }

    .alert-success {
      background: rgba(0, 209, 255, 0.1);
      border: 1px solid rgba(0, 209, 255, 0.3);
      color: var(--accent);
    }
  </style>
</head>

<body>
  <header>
    <div class="header-inner">
      <h1>Stockly</h1>
    </div>
  </header>

  <div class="auth-container">
    <div class="auth-card">
      <div class="card">
        <h2>Recuperar contraseña</h2>
        <p class="text-muted">Ingresa tu correo electrónico asociado a tu cuenta y te enviaremos un codigo para
          restablecer tu contraseña.</p>

        <form id="reset-form">
          <div class="field">
            <label class="label" for="reset-email">Email</label>
            <input type="email" id="reset-email" name="email" required placeholder="tu@email.com" max="{{Limits.USER_EMAIL_MAX}}">
          </div>

          <div class="form-actions">
            <button type="submit" class="btn" id="submit-btn">Enviar codigo</button>
          </div>
        </form>

        <form id="code-form" style="display:none;">
          <div class="field">
            <label class="label" for="reset-code">Código recibido</label>
            <input type="text" id="reset-code" name="code" maxlength="{{Limits.USER_CODE_MAX}}" required placeholder="Ingresa el código">
          </div>
          <div class="form-actions">
            <button type="submit" class="btn" id="code-btn">Validar código</button>
          </div>
        </form>

        <form id="newpass-form" style="display:none;">
          <div class="field">
            <label class="label" for="new-password">Nueva contraseña</label>
            <input type="password" id="new-password" maxlength="{{Limits.USER_PASSWORD_MAX}}" name="new_password" required placeholder="Nueva contraseña">
          </div>
          <div class="field">
            <label class="label" for="confirm-password">Confirmar contraseña</label>
            <input type="password" id="confirm-password" maxlength="{{Limits.USER_PASSWORD_MAX}}" name="confirm_password" required
              placeholder="Confirmar contraseña">
          </div>
          <div class="form-actions">
            <button type="submit" class="btn" id="newpass-btn">Cambiar contraseña</button>
          </div>
        </form>

        <div class="back-link">
          <a href="{{ url_for('auth.login') }}">← Volver al inicio de sesión</a>
        </div>
      </div>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      let lastEmail = '';
      let codeValue = '';

      const resetForm   = document.getElementById('reset-form');
      const codeForm    = document.getElementById('code-form');
      const newpassForm = document.getElementById('newpass-form');

      const submitBtn  = document.getElementById('submit-btn');
      const codeBtn    = document.getElementById('code-btn');
      const newpassBtn = document.getElementById('newpass-btn');

      const emailInput           = document.getElementById('reset-email');
      const codeInput            = document.getElementById('reset-code');
      const newPasswordInput     = document.getElementById('new-password');
      const confirmPasswordInput = document.getElementById('confirm-password');

      function showAlert(referenceEl, type, message) {
        document.querySelectorAll('.alert').forEach(a => a.remove());
        const alert = document.createElement('div');
        alert.className = `alert alert-${type}`;
        alert.textContent = message;
        referenceEl.parentNode.insertBefore(alert, referenceEl);
      }

      function setLoading(btn, loading, idleText) {
        btn.disabled = loading;
        btn.textContent = loading ? 'Cargando...' : idleText;
      }

      // Paso 1: enviar email
      resetForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        lastEmail = emailInput.value.trim();
        setLoading(submitBtn, true, 'Enviar codigo');

        try {
          const res  = await fetch('/api/users/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: lastEmail })
          });
          const data = await res.json();

          if (res.ok) {
            showAlert(resetForm, 'success', data.message);
            emailInput.value = '';
            resetForm.style.display = 'none';
            codeForm.style.display  = 'block';
          } else {
            showAlert(resetForm, 'error', data.error || 'Error al procesar la solicitud.');
          }
        } catch {
          showAlert(resetForm, 'error', 'Error de conexión. Intenta nuevamente.');
        } finally {
          setLoading(submitBtn, false, 'Enviar codigo');
        }
      });

      // Paso 2: validar código
      codeForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        codeValue = codeInput.value.trim();
        setLoading(codeBtn, true, 'Validar código');

        try {
          const res  = await fetch('/api/users/validate-code', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: lastEmail, code: codeValue })
          });
          const data = await res.json();

          if (res.ok) {
            showAlert(codeForm, 'success', 'Código validado. Ingresa tu nueva contraseña.');
            codeForm.style.display    = 'none';
            newpassForm.style.display = 'block';
          } else {
            showAlert(codeForm, 'error', data.error || 'Código inválido.');
          }
        } catch {
          showAlert(codeForm, 'error', 'Error de conexión. Intenta nuevamente.');
        } finally {
          setLoading(codeBtn, false, 'Validar código');
        }
      });

      // Paso 3: nueva contraseña
      newpassForm.addEventListener('submit', async function (e) {
        e.preventDefault();

        if (newPasswordInput.value !== confirmPasswordInput.value) {
          showAlert(newpassForm, 'error', 'Las contraseñas no coinciden.');
          return;
        }

        setLoading(newpassBtn, true, 'Cambiar contraseña');

        try {
          const res  = await fetch('/api/users/reset-password/change-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: lastEmail,
              code: codeValue,
              new_password: newPasswordInput.value
            })
          });
          const data = await res.json();

          if (res.ok) {
            showAlert(newpassForm, 'success', 'Contraseña cambiada correctamente. Ahora puedes iniciar sesión.');
            newpassForm.style.display = 'none';
            setTimeout(() => { window.location.href = '/login'; }, 2000);
          } else {
            showAlert(newpassForm, 'error', data.error || 'Error al cambiar la contraseña.');
          }
        } catch {
          showAlert(newpassForm, 'error', 'Error de conexión. Intenta nuevamente.');
        } finally {
          setLoading(newpassBtn, false, 'Cambiar contraseña');
        }
      });
    });
  </script>
</body>

</html>
