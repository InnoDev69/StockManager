{% extends "base.html" %}
{% block content %}
<link rel="stylesheet" href="/static/css/calendar-picker.css">
<script src="/static/js/calendar-picker.js"></script>

<div class="card" style="max-width:720px; margin:1rem auto;">
  <h2>Agregar Producto</h2>
  <form id="product-form" novalidate>
    <!-- Alert de validación global -->
    <div id="form-validation-error" style="display: none; padding: 0.75rem 1rem; border: 1px solid var(--danger); border-radius: 6px; background: rgba(239, 68, 68, 0.1); color: var(--danger); margin-bottom: 1rem; font-size: 0.9rem;"></div>
    
    <div class="field">
      <label class="label">Código de barras <span style="color: var(--text-muted); font-weight: 400;">(opcional)</span></label>
      <div style="display: flex; gap: 8px; align-items: flex-start;">
        <div style="flex: 1;">
          <input id="barrs_code" name="barrs_code" placeholder="EAN / UPC / Code128..." 
                value="{{ form_data.barrs_code or '' }}" maxlength="{{Limits.ITEM_BARCODE_MAX}}" />
          <small style="color: var(--text-muted); font-size: 0.8rem; display: block; margin-top: 0.25rem;">Si está vacío se generará: PRD######</small>
          <span class="field-error" data-field="Código de barras"></span>
        </div>
        <button type="button" class="btn btn-ghost" onclick="generateProposedBarcode()" style="margin-top: 0; white-space: nowrap; padding: 0.65rem 0.85rem;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 4px;">
            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
            <line x1="7" y1="3" x2="7" y2="21"/><line x1="13" y1="3" x2="13" y2="21"/><line x1="19" y1="3" x2="19" y2="21"/>
          </svg>
          Generar
        </button>
      </div>
    </div>
    <div class="field">
      <label class="label">Nombre <span style="color: var(--danger);">*</span></label>
      <input name="name" required maxlength="{{Limits.ITEM_NAME_MAX}}"
             value="{{ form_data.name or '' }}" placeholder="Nombre del producto" />
      <span class="field-error" data-field="Nombre"></span>
    </div>
    <div class="field">
      <label class="label">Descripción</label>
      <input name="description" maxlength="{{Limits.ITEM_DESCRIPTION_MAX}}"
             value="{{ form_data.description or '' }}" placeholder="Descripción detallada (opcional)" />
      <span class="field-error" data-field="Descripción"></span>
    </div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
      <div class="field">
        <label class="label">Stock inicial <span style="color: var(--danger);">*</span></label>
        <input type="number" name="quantity" min="0" max="{{Limits.ITEM_QUANTITY_MAX}}"
               value="{{ form_data.quantity or 0 }}" required placeholder="0" />
        <span class="field-error" data-field="Cantidad"></span>
      </div>
      <div class="field">
        <label class="label">Stock mínimo <span style="color: var(--danger);">*</span></label>
        <input type="number" name="min_quantity" min="0" max="{{Limits.ITEM_MIN_QUANTITY_MAX}}"
               value="{{ form_data.min_quantity or 0 }}" required placeholder="0" />
        <small style="color: var(--text-muted); font-size: 0.8rem; display: block; margin-top: 0.25rem;"> Alerta si baja de este nivel</small>
        <span class="field-error" data-field="Cantidad mínima"></span>
      </div>
    </div>
    <div class="field">
      <label class="label">Precio <span style="color: var(--danger);">*</span></label>
      <input type="number" step="0.01" name="price" min="0" max="{{Limits.ITEM_PRICE_MAX}}"
             value="{{ form_data.price or '0.00' }}" required placeholder="0.00" />
      <span class="field-error" data-field="Precio"></span>
    </div>
    <div class="field">
      <label class="label">Fecha de expiración <span style="color: var(--text-muted); font-weight: 400;">(opcional)</span></label>
      <input type="text" name="expiration_date" placeholder="14/05/2027" 
       pattern="\d{2}/\d{2}/\d{4}" maxlength="10"
       data-calendar-min-year="{{ Limits.CALENDAR_YEAR_MIN }}"
       data-calendar-max-year="{{ Limits.CALENDAR_YEAR_MAX }}" />
      <span class="field-error" data-field="Fecha de expiración"></span>
    </div>
    <div class="form-actions">
      <a href="/" class="btn btn-ghost">Cancelar</a>
      <button class="btn" type="submit" id="submit-btn">Agregar Producto</button>
    </div>
  </form>
</div>
<script src="{{ url_for('static', filename='js/products-crud.js') }}"></script>
<script>
function generateProposedBarcode() {
  const timestamp = Date.now().toString().slice(-6);
  const proposed = `PRD${timestamp.padStart(6, '0')}`;
  document.getElementById('barrs_code').value = proposed;
}
</script>
{% endblock %}
