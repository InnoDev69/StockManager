name: Test Build (No Release)

# Vista previa del release: arma el mismo paquete que build.yml, pero no crea
# tag, no firma y no publica nada. Los artifacts duran 3 días.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a mostrar en la vista previa (ej: 1.2.3)'
        required: false
        default: '0.0.0-ci'

env:
  # Puerto donde levanta Flask/Waitress la app. Ajustalo si es otro.
  APP_PORT: "5000"
  # Segundos máximos de espera a que el servidor responda en el smoke test
  SMOKE_TIMEOUT: "90"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-0.0.0-ci}"
          printf '__version__ = "%s"\n' "$VERSION" > core/version.py
          echo "Versión: $VERSION"
        shell: bash

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==6.19.0 pyinstaller-hooks-contrib
          pip install -r requirements.txt
        shell: bash

      # Igual que build.yml: sin el secreto el paquete sale con las licencias desactivadas
      - name: Install license library (private repo)
        env:
          LICENSE_LIB_TOKEN: ${{ secrets.LICENSE_LIB_TOKEN }}
        shell: bash
        run: |
          if [ -n "$LICENSE_LIB_TOKEN" ]; then
            pip install "git+https://x-access-token:${LICENSE_LIB_TOKEN}@github.com/InnoDev69/stockly-license.git@v0.2.0"
            python -c "import stockly_license; print('stockly_license', stockly_license.__version__)"
          else
            echo "::warning::Sin LICENSE_LIB_TOKEN: este paquete sale con las licencias desactivadas"
          fi

      # pythonnet: backend WinForms de pywebview
      - name: Install pythonnet
        run: pip install pythonnet
        shell: bash

      - name: Debug environment
        run: |
          python --version
          pip show pyinstaller
          pip show pywebview
        shell: bash

      - name: Build with PyInstaller
        run: pyinstaller --clean build.spec
        shell: bash

      # Las credenciales SMTP no deben viajar en el paquete público
      - name: Verify package does not include .env
        run: |
          found_files=$(find dist -name ".env")
          if [ -n "$found_files" ]; then
            echo "::error::El paquete incluye archivos .env:"
            echo "$found_files"
            exit 1
          fi
        shell: bash

      # El ayudante (update.exe) viaja DENTRO del zip, igual que en el release real
      - name: Build updater (update.exe)
        run: pyinstaller --clean --noconfirm stockly_updater/update.spec
        shell: bash

      - name: Updater self-test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/update.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "El autochequeo del actualizador falló (código $($p.ExitCode))" }

      - name: Add updater and version.json to the app folder
        shell: bash
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' core/version.py)
          cp dist/update.exe dist/stockly/update.exe
          printf '{"version": "v%s"}\n' "$VERSION" > dist/stockly/version.json

      - name: Verify build output
        run: ls -lhR dist/stockly/
        shell: bash

      # ============================================================
      # Smoke test: arranca el .exe y verifica que el servidor responde
      # ============================================================
      - name: Smoke test (arranque del ejecutable)
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\stockly\stockly.exe"
          if (-not (Test-Path $exe)) { throw "No existe $exe" }

          $proc = Start-Process -FilePath $exe `
            -WorkingDirectory (Split-Path $exe) -PassThru
          $ok = $false

          try {
            $deadline = (Get-Date).AddSeconds([int]$env:SMOKE_TIMEOUT)
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 2

              if ($proc.HasExited) {
                throw "El proceso terminó antes de tiempo (exit code $($proc.ExitCode))"
              }

              try {
                # Cualquier respuesta HTTP (200, 302, 401...) indica que el servidor está arriba
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:$($env:APP_PORT)/" `
                  -UseBasicParsing -TimeoutSec 5 -SkipHttpErrorCheck
                Write-Host "Servidor respondió con HTTP $($r.StatusCode)"
                $ok = $true
                break
              } catch {
                Write-Host "Aún sin respuesta: $($_.Exception.Message)"
              }
            }

            if (-not $ok) {
              throw "El servidor no respondió en $($env:SMOKE_TIMEOUT)s en el puerto $($env:APP_PORT)"
            }
          }
          finally {
            # /T mata también los procesos hijos (WebView2, etc.)
            if (-not $proc.HasExited) {
              taskkill /PID $proc.Id /T /F | Out-Null
            }
          }

      # Solo si el smoke test falla: muestra el log de la app (no contiene datos de usuario)
      - name: Diagnóstico del arranque (solo si falla)
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem "$env:APPDATA\StockManager\logs" -Filter "app_*.log" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime | Select-Object -Last 1 | ForEach-Object {
              Write-Host "== $($_.FullName)"
              Get-Content $_.FullName -Tail 200
            }

      # Solo si falla: el mismo .exe en modo servidor (sin ventana). Si responde, el problema
      # está en la parte de escritorio; si no, en el arranque común.
      - name: Diagnóstico modo servidor (solo si falla)
        if: failure()
        shell: pwsh
        env:
          STOCKLY_SERVER_ONLY: "1"
        run: |
          $exe = Join-Path $PWD "dist\stockly\stockly.exe"
          $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          Start-Sleep -Seconds 30
          if (-not $p.HasExited) {
            pip install -q py-spy
            Write-Host "== Stack de Python del proceso colgado:"
            py-spy dump --pid $p.Id
          }
          Start-Sleep -Seconds 30
          if ($p.HasExited) {
            Write-Host "Modo servidor: el proceso terminó con código $($p.ExitCode)"
          } else {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:$($env:APP_PORT)/" -UseBasicParsing -TimeoutSec 5 -SkipHttpErrorCheck
              Write-Host "Modo servidor: HTTP $($r.StatusCode)"
            } catch {
              Write-Host "Modo servidor: sin respuesta ($($_.Exception.Message))"
            }
          }
          taskkill /PID $p.Id /T /F 2>$null | Out-Null

      # Mismo nombre que el zip del release real (build.yml)
      - name: Create Windows zip
        run: |
          cd dist
          Compress-Archive -Path stockly -DestinationPath Stockly-windows-x64.zip
        shell: pwsh

      # Firma el zip de prueba con el secreto real (no se publica) y comprueba que la
      # clave pública resultante esté en stockly_updater/release_keys.py
      - name: Check release signing key
        shell: bash
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -o pipefail
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' core/version.py)
          mkdir -p release-meta-dryrun
          python -m stockly_updater.sign_release --tag "v$VERSION" --out-dir release-meta-dryrun dist/Stockly-windows-x64.zip | tee release-meta-dryrun/sign.log
          PUB=$(awk -F': ' '/Clave p/ {print $NF}' release-meta-dryrun/sign.log | tr -d '\r')
          if [ -z "$PUB" ]; then
            echo "::error::No se pudo leer la clave pública de la firma"
            exit 1
          fi
          if ! grep -qF "\"$PUB\"" stockly_updater/release_keys.py; then
            echo "::error::La clave pública del secreto RELEASE_SIGNING_KEY ($PUB) no está en stockly_updater/release_keys.py. Pegala ahí antes de publicar."
            exit 1
          fi
          echo "Clave pública verificada: $PUB"

      # Resumen en la página del run: cómo se vería el release
      - name: Release preview (resumen)
        shell: bash
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' core/version.py)
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log "$PREV_TAG..HEAD" --pretty=format:"- %s")
            RANGE_TITLE="desde $PREV_TAG"
          else
            CHANGELOG=$(git log -n 20 --pretty=format:"- %s")
            RANGE_TITLE="últimos 20 commits (no hay tags previos)"
          fi
          {
            echo "## Vista previa del release v$VERSION (NO publicado)"
            echo ""
            echo "**Archivo:** \`Stockly-windows-x64.zip\`"
            echo ""
            echo "**Contenido de la carpeta stockly (nivel superior):**"
            echo '```'
            ls dist/stockly
            echo '```'
            echo ""
            echo "**Changelog ($RANGE_TITLE):**"
            echo ""
            echo "$CHANGELOG"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: StockManager-Windows-DryRun
          path: dist/Stockly-windows-x64.zip
          if-no-files-found: error
          retention-days: 3
