name: Build Multi-Platform Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_name: StockManager-Linux
          - os: windows-latest
            platform: windows
            artifact_name: StockManager-Windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi python3-gi-cairo \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
            libgirepository-2.0-dev gcc libcairo2-dev \
            pkg-config python3-dev meson \
            file fuse libfuse2
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyinstaller-hooks-contrib pywebview
          pip install flask werkzeug requests python-dotenv
      
      - name: Install PyGObject (Linux)
        if: matrix.platform == 'linux'
        run: pip install PyGObject

      - name: Build with PyInstaller
        run: pyinstaller build.spec
        shell: bash

      - name: Verify build
        run: ls -lh dist/
        shell: bash

      # --- Linux artifacts ---
      - name: Create Linux tarball
        if: matrix.platform == 'linux'
        run: |
          cd dist
          tar -czf StockManager-linux-x64.tar.gz stock-manager-server
        shell: bash

      - name: Upload Linux tarball
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-tarball
          path: dist/StockManager-linux-x64.tar.gz
          if-no-files-found: error

      - name: Create AppImage (Linux)
        if: matrix.platform == 'linux'
        run: |
          # Descargar appimagetool
          wget -O appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          
          # Crear estructura AppDir
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          
          # Copiar el ejecutable
          cp dist/stock-manager-server AppDir/usr/bin/
          
          # Crear archivo .desktop
          cat > AppDir/stock-manager.desktop << 'EOF'
          [Desktop Entry]
          Name=Stock Manager
          Exec=stock-manager-server
          Icon=stock-manager
          Type=Application
          Categories=Office;Finance;
          Comment=Sistema de gestión de inventario y ventas
          Terminal=false
          EOF
          
          # Crear un ícono simple (placeholder - puedes reemplazar con tu propio ícono)
          # Si tienes un ícono en el repositorio, cópialo aquí
          if [ -f "static/icon.png" ]; then
            cp static/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/stock-manager.png
          else
            # Crear un ícono placeholder
            convert -size 256x256 xc:blue -fill white -pointsize 72 -gravity center \
              -annotate +0+0 'SM' AppDir/usr/share/icons/hicolor/256x256/apps/stock-manager.png 2>/dev/null || \
              touch AppDir/usr/share/icons/hicolor/256x256/apps/stock-manager.png
          fi
          
          # Copiar el .desktop a la raíz de AppDir
          cp AppDir/stock-manager.desktop AppDir/
          
          # Crear AppRun
          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          exec "${HERE}/usr/bin/stock-manager-server" "$@"
          EOF
          chmod +x AppDir/AppRun
          
          # Crear el AppImage
          ARCH=x86_64 ./appimagetool AppDir StockManager-x86_64.AppImage
          
          # Mover a dist
          mv StockManager-x86_64.AppImage dist/
        shell: bash

      - name: Upload Linux AppImage
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-appimage
          path: dist/StockManager-x86_64.AppImage
          if-no-files-found: error

      # --- Windows artifacts ---
      - name: Upload Windows EXE
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.AppImage
            artifacts/**/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## Descargas
            ### Windows
            - **stock-manager-server.exe** - Ejecutable para Windows 10/11
            
            ### Linux
            - **StockManager-x86_64.AppImage** - AppImage universal para Linux (recomendado)
            - **StockManager-linux-x64.tar.gz** - Ejecutable standalone para Linux
            
            ## Instalación
            **Windows:**
            ```
            Descarga y ejecuta stock-manager-server.exe
            ```
            
            **Linux (AppImage):**
            ```bash
            chmod +x StockManager-x86_64.AppImage
            ./StockManager-x86_64.AppImage
            ```
            
            **Linux (Tarball):**
            ```bash
            tar -xzf StockManager-linux-x64.tar.gz
            chmod +x stock-manager-server
            ./stock-manager-server
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}