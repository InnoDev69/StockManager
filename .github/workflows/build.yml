name: Build Multi-Platform Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_name: StockManager-Linux
            targets: "AppImage deb"
          - os: windows-latest
            platform: windows
            artifact_name: StockManager-Windows
            targets: "nsis"
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Sync app version with tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME="${GITHUB_REF##*/}"
          VERSION="${TAG_NAME#v}"
          echo "Setting package.json version to ${VERSION}"
          npm version --no-git-tag-version "${VERSION}"
        shell: bash
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      # ============ MEJORADO: Instalar dependencias del sistema para Linux ============
      - name: Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.0 \
            libgirepository1.0-dev \
            gobject-introspection \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev
      # ============================================================================
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask werkzeug pyinstaller requests python-dotenv pywebview PyGObject
      
      - name: Install Node dependencies
        run: npm ci
      
      - name: Build Python server
        run: pyinstaller build.spec
        shell: bash
      
      - name: Verify Python build
        run: ls -la dist/
        shell: bash
      
      - name: Clean Electron output directories (Linux)
        if: matrix.platform == 'linux'
        run: rm -rf dist/linux-unpacked dist/*.AppImage dist/*.deb dist/*.pacman dist/*.blockmap 2>/dev/null || true
        shell: bash
      
      - name: Clean Electron output directories (Windows)
        if: matrix.platform == 'windows'
        run: |
          rm -rf dist/win-unpacked 2>/dev/null || true
          rm -f dist/*.blockmap 2>/dev/null || true
        shell: bash
      
      - name: Build Electron app (Linux)
        if: matrix.platform == 'linux'
        run: npm run build:linux -- --linux ${{ matrix.targets }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build Electron app (Windows)
        if: matrix.platform == 'windows'
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: List final artifacts
        run: ls -lh dist/
        shell: bash
      
      - name: Upload AppImage (Linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-AppImage
          path: dist/*.AppImage
          if-no-files-found: error
      
      - name: Upload DEB (Linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-DEB
          path: dist/*.deb
          if-no-files-found: warn

      - name: Upload Linux TAR.GZ
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-TAR
          path: dist/*.tar.gz
          if-no-files-found: warn
      
      - name: Compress Linux unpacked directory
        if: matrix.platform == 'linux'
        run: |
          cd dist
          if [ -d "linux-unpacked" ]; then
            tar -czf linux-unpacked.tar.gz linux-unpacked/
            echo "Compressed linux-unpacked directory"
          else
            echo "linux-unpacked directory not found"
          fi
        shell: bash
      
      - name: Upload Linux unpacked
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-Unpacked
          path: dist/linux-unpacked.tar.gz
          if-no-files-found: warn
      
      - name: Upload Windows EXE files
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-EXE
          path: dist/*.exe
          if-no-files-found: error

      - name: Upload Windows ZIP
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-ZIP
          path: dist/*.zip
          if-no-files-found: warn

  release:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Display structure
        run: ls -R artifacts/
      
      - name: Remove duplicate files
        run: |
          cd artifacts
          find . -type f -name "*.exe" | sort | uniq -d | xargs -r rm -f
          echo "Files to upload:"
          find . -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.exe" \)
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.exe
            artifacts/**/*-Unpacked/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## Descargas

            ### Windows
            - **Stock Manager Setup.exe** - Instalador para Windows 10/11

            ### Linux
            - **stock-manager.AppImage** - Portable para cualquier distribución (incluye todas las dependencias)
            - **stock-manager.deb** - Paquete para Debian/Ubuntu/Mint
            - **linux-unpacked.tar.gz** - Versión sin empaquetar (desarrollo/debug)

            ## Instalación

            **Windows:**
            ```
            Ejecuta el instalador y sigue las instrucciones
            ```

            **Linux (AppImage) - RECOMENDADO para Arch/Manjaro:**
            ```bash
            chmod +x stock-manager-*.AppImage
            ./stock-manager-*.AppImage
            ```

            **Debian/Ubuntu:**
            ```bash
            sudo dpkg -i stock-manager_*.deb
            sudo apt-get install -f
            ```

            **Arch Linux (si AppImage no funciona):**
            ```bash
            # Instalar dependencias necesarias
            sudo pacman -S python-gobject gtk3 webkit2gtk
            # Luego ejecutar la versión unpacked
            tar -xzf linux-unpacked.tar.gz
            cd linux-unpacked
            ./stock-manager
            ```

            **Linux (unpacked):**
            ```bash
                        tar -xzf linux-unpacked.tar.gz
                        cd linux-unpacked
                        ./stock-manager
            ```

            ## Solución de problemas

            Si en Linux obtienes errores sobre GTK o QT faltantes:
            - **AppImage debería funcionar sin dependencias adicionales**
            - Si no funciona, instala: `sudo pacman -S python-gobject gtk3 webkit2gtk` (Arch)
            - O: `sudo apt install python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.0` (Debian/Ubuntu)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}