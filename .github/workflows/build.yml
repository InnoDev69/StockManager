name: Build Multi-Platform Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-ubuntu
            artifact_name: StockManager-Ubuntu
          - os: windows-latest
            platform: windows
            artifact_name: StockManager-Windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "SMTP_SERVER=${{ secrets.SMTP_SERVER }}" >> .env
          echo "SMTP_PORT=${{ secrets.SMTP_PORT }}" >> .env
          echo "SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}" >> .env
          echo "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}" >> .env
        shell: bash

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # --- Dependencias de sistema (Ubuntu) ---
      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'linux-ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi python3-gi-cairo \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
            libgirepository-2.0-dev gcc libcairo2-dev \
            pkg-config python3-dev meson

      # --- Dependencias Python comunes ---
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==6.19.0 pyinstaller-hooks-contrib
          pip install -r requirements.txt
        shell: bash

      # --- PyGObject solo en Linux ---
      - name: Install PyGObject (Linux)
        if: matrix.platform == 'linux-ubuntu'
        run: pip install PyGObject pycairo

      # --- pythonnet solo en Windows (backend WinForms de pywebview) ---
      - name: Install pythonnet (Windows)
        if: matrix.platform == 'windows'
        run: pip install pythonnet
        shell: bash

      # --- Debug: mostrar entorno antes de buildear ---
      - name: Debug environment
        run: |
          python --version
          pip show pyinstaller
          pip show pywebview
        shell: bash

      - name: Build with PyInstaller
        run: pyinstaller --clean build.spec
        shell: bash

      - name: Verify build output
        run: ls -lhR dist/stockly/
        shell: bash

      # ============================================================
      # Ubuntu artifacts
      # ============================================================
      - name: Create Ubuntu tarball
        if: matrix.platform == 'linux-ubuntu'
        run: |
          cd dist
          tar -czf Stockly-ubuntu-x64.tar.gz stockly
        shell: bash

      - name: Upload Ubuntu tarball
        if: matrix.platform == 'linux-ubuntu'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/Stockly-ubuntu-x64.tar.gz
          if-no-files-found: error

      # ============================================================
      # Windows artifacts
      # -Path stockly (sin *) para que el zip contenga la carpeta
      # y al extraer quede: stockly\stockly.exe
      # ============================================================
      - name: Create Windows zip
        if: matrix.platform == 'windows'
        run: |
          cd dist
          Compress-Archive -Path stockly -DestinationPath Stockly-windows-x64.zip
        shell: pwsh

      - name: Upload Windows zip
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/Stockly-windows-x64.zip
          if-no-files-found: error

  # ================================================================
  # Build Arch Linux
  # ================================================================
  build-arch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build in Arch Linux container
        uses: docker://archlinux:latest
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        with:
          args: /bin/bash -c "
            pacman -Syu --noconfirm &&
            pacman -S --noconfirm python python-pip python-gobject python-cairo gtk3 webkit2gtk-4.1 base-devel &&
            python --version &&
            pip install --break-system-packages pyinstaller==6.19.0 pyinstaller-hooks-contrib &&
            pip install --break-system-packages -r /github/workspace/requirements.txt &&
            cd /github/workspace &&
            echo 'SMTP_SERVER='$SMTP_SERVER >> .env &&
            echo 'SMTP_PORT='$SMTP_PORT >> .env &&
            echo 'SMTP_USERNAME='$SMTP_USERNAME >> .env &&
            echo 'SMTP_PASSWORD='$SMTP_PASSWORD >> .env &&
            pyinstaller --clean build.spec &&
            cd dist &&
            tar -czf Stockly-arch-x64.tar.gz stockly &&
            echo '=== BUILD OK ===' &&
            ls -lh Stockly-arch-x64.tar.gz
            "

      - name: Upload Arch tarball
        uses: actions/upload-artifact@v4
        with:
          name: Stockly-Arch
          path: dist/Stockly-arch-x64.tar.gz
          if-no-files-found: error

  # ================================================================
  # Release — solo cuando se pushea un tag v*.*.*
  # ================================================================
  release:
    needs: [build, build-arch]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts/

      - name: Generate changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            RANGE="${{ github.ref_name }}"
          else
            RANGE="$PREV_TAG..${{ github.ref_name }}"
          fi
          echo "## Changelog" > changelog.md
          git log $RANGE --pretty=format:"- %s" >> changelog.md
          echo "" >> changelog.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          body_path: changelog.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}