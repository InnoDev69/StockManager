name: Build Multi-Platform Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_name: StockManager-Linux
          - os: windows-latest
            platform: windows
            artifact_name: StockManager-Windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi python3-gi-cairo \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
            libgirepository-2.0-dev gcc libcairo2-dev \
            pkg-config python3-dev meson \
            file fuse libfuse2 \
            libwebkit2gtk-4.1-0 libgtk-3-0 \
            desktop-file-utils
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyinstaller-hooks-contrib pywebview
          pip install flask werkzeug requests python-dotenv
      
      - name: Install PyGObject (Linux)
        if: matrix.platform == 'linux'
        run: pip install PyGObject

      - name: Build with PyInstaller
        run: pyinstaller build.spec
        shell: bash

      - name: Verify build
        run: ls -lh dist/
        shell: bash

      # --- Linux artifacts ---
      - name: Create Linux tarball
        if: matrix.platform == 'linux'
        run: |
          cd dist
          tar -czf StockManager-linux-x64.tar.gz stock-manager-server
        shell: bash

      - name: Upload Linux tarball
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-tarball
          path: dist/StockManager-linux-x64.tar.gz
          if-no-files-found: error

      - name: Create AppImage (Linux)
        if: matrix.platform == 'linux'
        run: |
          # Descargar herramientas necesarias
          wget -O linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          
          wget -O appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          
          # Crear estructura AppDir
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          
          # Copiar el ejecutable
          cp dist/stock-manager-server AppDir/usr/bin/
          chmod +x AppDir/usr/bin/stock-manager-server
          
          # Crear archivo .desktop
          cat > AppDir/usr/share/applications/stock-manager.desktop << 'EOF'
          [Desktop Entry]
          Name=Stock Manager
          Exec=stock-manager-server
          Icon=stock-manager
          Type=Application
          Categories=Office;Finance;
          Comment=Sistema de gestión de inventario y ventas
          Terminal=false
          EOF
          
          # Crear un ícono placeholder
          if [ -f "static/icon.png" ]; then
            cp static/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/stock-manager.png
          else
            # Crear un ícono SVG simple
            cat > AppDir/usr/share/icons/hicolor/256x256/apps/stock-manager.svg << 'SVGEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <svg width="256" height="256" xmlns="http://www.w3.org/2000/svg">
            <rect width="256" height="256" fill="#2196F3"/>
            <text x="128" y="150" font-size="100" fill="white" text-anchor="middle" font-family="sans-serif" font-weight="bold">SM</text>
          </svg>
          SVGEOF
            # Para compatibilidad, crear también PNG
            convert AppDir/usr/share/icons/hicolor/256x256/apps/stock-manager.svg \
              AppDir/usr/share/icons/hicolor/256x256/apps/stock-manager.png 2>/dev/null || \
              touch AppDir/usr/share/icons/hicolor/256x256/apps/stock-manager.png
          fi
          
          # Crear AppRun con configuración de entorno
          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          
          # Configurar variables de entorno para GTK/GI
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          export GI_TYPELIB_PATH="${HERE}/usr/lib/girepository-1.0:${GI_TYPELIB_PATH}"
          export XDG_DATA_DIRS="${HERE}/usr/share:${XDG_DATA_DIRS}"
          
          # Indicar que estamos en un AppImage
          export APPIMAGE_RUNNING=1
          
          # Ejecutar la aplicación
          exec "${HERE}/usr/bin/stock-manager-server" "$@"
          EOF
          chmod +x AppDir/AppRun
          
          # Copiar bibliotecas GTK y WebKit necesarias
          mkdir -p AppDir/usr/lib
          
          # Copiar libraries de sistema necesarias
          for lib in \
            /usr/lib/x86_64-linux-gnu/libwebkit2gtk-4.1.so* \
            /usr/lib/x86_64-linux-gnu/libjavascriptcoregtk-4.1.so* \
            /usr/lib/x86_64-linux-gnu/libgtk-3.so* \
            /usr/lib/x86_64-linux-gnu/libgdk-3.so* \
            /usr/lib/x86_64-linux-gnu/libsoup-*.so* \
            /usr/lib/x86_64-linux-gnu/libwebkit*.so*
          do
            if [ -f "$lib" ] || [ -L "$lib" ]; then
              cp -P "$lib" AppDir/usr/lib/ 2>/dev/null || true
            fi
          done
          
          # Copiar typelibs de GObject Introspection
          mkdir -p AppDir/usr/lib/girepository-1.0
          for typelib in WebKit2-4.1 Gtk-3.0 Gdk-3.0 GdkPixbuf-2.0 Soup-3.0
          do
            find /usr/lib -name "${typelib}.typelib" -exec cp {} AppDir/usr/lib/girepository-1.0/ \; 2>/dev/null || true
          done
          
          # Usar linuxdeploy para copiar dependencias automáticamente
          ./linuxdeploy --appdir AppDir \
            --executable AppDir/usr/bin/stock-manager-server \
            --desktop-file AppDir/usr/share/applications/stock-manager.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/stock-manager.png 2>/dev/null || true
          
          # Crear el AppImage
          ARCH=x86_64 ./appimagetool --no-appstream AppDir StockManager-x86_64.AppImage
          
          # Mover a dist
          mv StockManager-x86_64.AppImage dist/
        shell: bash

      - name: Upload Linux AppImage
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-appimage
          path: dist/StockManager-x86_64.AppImage
          if-no-files-found: error

      # --- Windows artifacts ---
      - name: Upload Windows EXE
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.AppImage
            artifacts/**/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## Descargas
            ### Windows
            - **stock-manager-server.exe** - Ejecutable para Windows 10/11
            
            ### Linux
            - **StockManager-x86_64.AppImage** - AppImage universal para Linux (recomendado)
            - **StockManager-linux-x64.tar.gz** - Ejecutable standalone para Linux (requiere dependencias GTK/WebKit instaladas)
            
            ## Instalación
            **Windows:**
            ```
            Descarga y ejecuta stock-manager-server.exe
            ```
            
            **Linux (AppImage):**
            ```bash
            chmod +x StockManager-x86_64.AppImage
            ./StockManager-x86_64.AppImage
            ```
            
            **Linux (Tarball):**
            Requiere dependencias del sistema:
            ```bash
            # Ubuntu/Debian
            sudo apt-get install python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1
            
            # Ejecutar
            tar -xzf StockManager-linux-x64.tar.gz
            chmod +x stock-manager-server
            ./stock-manager-server
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}