name: Build Windows Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Puerto donde levanta Flask/Waitress la app. Ajustalo si es otro.
  APP_PORT: "5000"
  # Segundos máximos de espera a que el servidor responda en el smoke test
  SMOKE_TIMEOUT: "90"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write version from tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0-ci"; fi
          printf '__version__ = "%s"\n' "$VERSION" > core/version.py
          echo "Versión: $VERSION"
        shell: bash

      - name: Create .env file
        run: |
          echo "SMTP_SERVER=${{ secrets.SMTP_SERVER }}" >> .env
          echo "SMTP_PORT=${{ secrets.SMTP_PORT }}" >> .env
          echo "SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}" >> .env
          echo "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}" >> .env
        shell: bash

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==6.19.0 pyinstaller-hooks-contrib
          pip install -r requirements.txt
        shell: bash

      # Licencias: la librería es de un repo privado. Sin el secreto LICENSE_LIB_TOKEN el
      # release sale con las licencias DESACTIVADAS (la app funciona igual).
      - name: Install license library (private repo)
        env:
          LICENSE_LIB_TOKEN: ${{ secrets.LICENSE_LIB_TOKEN }}
        shell: bash
        run: |
          if [ -n "$LICENSE_LIB_TOKEN" ]; then
            pip install "git+https://x-access-token:${LICENSE_LIB_TOKEN}@github.com/InnoDev69/stockly-license.git@v0.2.0"
            python -c "import stockly_license; print('stockly_license', stockly_license.__version__)"
          else
            echo "::warning::Sin LICENSE_LIB_TOKEN: este release sale con las licencias desactivadas"
          fi

      # pythonnet: backend WinForms de pywebview
      - name: Install pythonnet
        run: pip install pythonnet
        shell: bash

      - name: Debug environment
        run: |
          python --version
          pip show pyinstaller
          pip show pywebview
        shell: bash

      - name: Build with PyInstaller
        run: pyinstaller --clean build.spec
        shell: bash

      # El ayudante (update.exe) viaja DENTRO del zip: así también se actualiza a sí mismo.
      - name: Build updater (update.exe)
        run: pyinstaller --clean --noconfirm stockly_updater/update.spec
        shell: bash

      - name: Updater self-test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/update.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "El autochequeo del actualizador falló (código $($p.ExitCode))" }

      - name: Add updater and version.json to the app folder
        shell: bash
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' core/version.py)
          cp dist/update.exe dist/stockly/update.exe
          printf '{"version": "v%s"}\n' "$VERSION" > dist/stockly/version.json

      - name: Verify build output
        run: ls -lhR dist/stockly/
        shell: bash

      # ============================================================
      # Smoke test: arranca el .exe y verifica que el servidor responde
      # ============================================================
      - name: Smoke test (arranque del ejecutable)
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\stockly\stockly.exe"
          if (-not (Test-Path $exe)) { throw "No existe $exe" }

          $proc = Start-Process -FilePath $exe `
            -WorkingDirectory (Split-Path $exe) -PassThru
          $ok = $false

          try {
            $deadline = (Get-Date).AddSeconds([int]$env:SMOKE_TIMEOUT)
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 2

              if ($proc.HasExited) {
                throw "El proceso terminó antes de tiempo (exit code $($proc.ExitCode))"
              }

              try {
                # Cualquier respuesta HTTP (200, 302, 401...) indica que el servidor está arriba
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:$($env:APP_PORT)/" `
                  -UseBasicParsing -TimeoutSec 5 -SkipHttpErrorCheck
                Write-Host "Servidor respondió con HTTP $($r.StatusCode)"
                $ok = $true
                break
              } catch {
                Write-Host "Aún sin respuesta: $($_.Exception.Message)"
              }
            }

            if (-not $ok) {
              throw "El servidor no respondió en $($env:SMOKE_TIMEOUT)s en el puerto $($env:APP_PORT)"
            }
          }
          finally {
            # /T mata también los procesos hijos (WebView2, etc.)
            if (-not $proc.HasExited) {
              taskkill /PID $proc.Id /T /F | Out-Null
            }
          }

      - name: Create Windows zip
        run: |
          cd dist
          Compress-Archive -Path stockly -DestinationPath Stockly-windows-x64.zip
        shell: pwsh

      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: StockManager-Windows
          path: dist/Stockly-windows-x64.zip
          if-no-files-found: error

  # ================================================================
  # Release — solo cuando se pushea un tag v*.*.*
  # ================================================================
  release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts/

      - name: Generate changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            RANGE="${{ github.ref_name }}"
          else
            RANGE="$PREV_TAG..${{ github.ref_name }}"
          fi
          echo "## Changelog" > changelog.md
          git log $RANGE --pretty=format:"- %s" >> changelog.md
          echo "" >> changelog.md

      # Firma hash y tamaño de cada asset; el ayudante verifica esto antes de instalar.
      # Requiere el secreto RELEASE_SIGNING_KEY (clave privada de releases).
      - name: Sign release assets
        run: |
          python3 -m pip install --user pynacl
          python3 -m stockly_updater.sign_release --tag "${{ github.ref_name }}" --out-dir release-meta $(find artifacts -name '*.zip')
        shell: bash
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            artifacts/**/*.zip
            release-meta/manifest.json
            release-meta/manifest.json.sig
          body_path: changelog.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}