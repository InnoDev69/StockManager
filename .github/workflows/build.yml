name: Build Windows Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Puerto donde levanta Flask/Waitress la app. Ajustalo si es otro.
  APP_PORT: "5000"
  # Segundos máximos de espera a que el servidor responda en el smoke test
  SMOKE_TIMEOUT: "90"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "SMTP_SERVER=${{ secrets.SMTP_SERVER }}" >> .env
          echo "SMTP_PORT=${{ secrets.SMTP_PORT }}" >> .env
          echo "SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}" >> .env
          echo "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}" >> .env
        shell: bash

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==6.19.0 pyinstaller-hooks-contrib
          pip install -r requirements.txt
        shell: bash

      # pythonnet: backend WinForms de pywebview
      - name: Install pythonnet
        run: pip install pythonnet
        shell: bash

      - name: Debug environment
        run: |
          python --version
          pip show pyinstaller
          pip show pywebview
        shell: bash

      - name: Build with PyInstaller
        run: pyinstaller --clean build.spec
        shell: bash

      - name: Verify build output
        run: ls -lhR dist/stockly/
        shell: bash

      # ============================================================
      # Smoke test: arranca el .exe y verifica que el servidor responde
      # ============================================================
      - name: Smoke test (arranque del ejecutable)
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\stockly\stockly.exe"
          if (-not (Test-Path $exe)) { throw "No existe $exe" }

          $proc = Start-Process -FilePath $exe `
            -WorkingDirectory (Split-Path $exe) -PassThru
          $ok = $false

          try {
            $deadline = (Get-Date).AddSeconds([int]$env:SMOKE_TIMEOUT)
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 2

              if ($proc.HasExited) {
                throw "El proceso terminó antes de tiempo (exit code $($proc.ExitCode))"
              }

              try {
                # Cualquier respuesta HTTP (200, 302, 401...) indica que el servidor está arriba
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:$($env:APP_PORT)/" `
                  -UseBasicParsing -TimeoutSec 5 -SkipHttpErrorCheck
                Write-Host "Servidor respondió con HTTP $($r.StatusCode)"
                $ok = $true
                break
              } catch {
                Write-Host "Aún sin respuesta: $($_.Exception.Message)"
              }
            }

            if (-not $ok) {
              throw "El servidor no respondió en $($env:SMOKE_TIMEOUT)s en el puerto $($env:APP_PORT)"
            }
          }
          finally {
            # /T mata también los procesos hijos (WebView2, etc.)
            if (-not $proc.HasExited) {
              taskkill /PID $proc.Id /T /F | Out-Null
            }
          }

      - name: Create Windows zip
        run: |
          cd dist
          Compress-Archive -Path stockly -DestinationPath Stockly-windows-x64.zip
        shell: pwsh

      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: StockManager-Windows
          path: dist/Stockly-windows-x64.zip
          if-no-files-found: error

  # ================================================================
  # Release — solo cuando se pushea un tag v*.*.*
  # ================================================================
  release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts/

      - name: Generate changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            RANGE="${{ github.ref_name }}"
          else
            RANGE="$PREV_TAG..${{ github.ref_name }}"
          fi
          echo "## Changelog" > changelog.md
          git log $RANGE --pretty=format:"- %s" >> changelog.md
          echo "" >> changelog.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            artifacts/**/*.zip
          body_path: changelog.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}