name: Build Multi-Platform Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-ubuntu
            artifact_name: StockManager-Ubuntu
            distro_name: Ubuntu/Debian
          - os: windows-latest
            platform: windows
            artifact_name: StockManager-Windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "SMTP_SERVER=${{ secrets.SMTP_SERVER }}" >> .env
          echo "SMTP_PORT=${{ secrets.SMTP_PORT }}" >> .env
          echo "SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}" >> .env
          echo "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}" >> .env
        shell: bash

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'linux-ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi python3-gi-cairo \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
            libgirepository-2.0-dev gcc libcairo2-dev \
            pkg-config python3-dev meson
      
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller pyinstaller-hooks-contrib pywebview waitress
          pip install -r requirements.txt
      
      - name: Install PyGObject (Linux)
        if: matrix.platform == 'linux-ubuntu'
        run: pip install PyGObject

      - name: Build with PyInstaller
        run: pyinstaller build.spec
        shell: bash

      - name: Verify build
        run: ls -lh dist/
        shell: bash

      # --- Ubuntu artifacts ---
      - name: Create Ubuntu tarball
        if: matrix.platform == 'linux-ubuntu'
        run: |
          cd dist
          tar -czf StockManager-ubuntu-x64.tar.gz stock-manager-server
        shell: bash

      - name: Upload Ubuntu tarball
        if: matrix.platform == 'linux-ubuntu'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/StockManager-ubuntu-x64.tar.gz
          if-no-files-found: error

      # --- Windows artifacts ---
      - name: Upload Windows EXE
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*.exe
          if-no-files-found: error

  build-arch:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build in Arch Linux container
        uses: docker://archlinux:latest
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        with:
          args: /bin/bash -c "
            pacman -Syu --noconfirm &&
            pacman -S --noconfirm python python-pip python-gobject gtk3 webkit2gtk-4.1 base-devel &&
            pip install --break-system-packages pyinstaller pyinstaller-hooks-contrib pywebview flask werkzeug requests python-dotenv pytz waitress &&
            cd /github/workspace &&
            echo 'SMTP_SERVER='$SMTP_SERVER >> .env &&
            echo 'SMTP_PORT='$SMTP_PORT >> .env &&
            echo 'SMTP_USERNAME='$SMTP_USERNAME >> .env &&
            echo 'SMTP_PASSWORD='$SMTP_PASSWORD >> .env &&
            pyinstaller build.spec &&
            cd dist &&
            tar -czf StockManager-arch-x64.tar.gz stock-manager-server
            "

      - name: Upload Arch tarball
        uses: actions/upload-artifact@v4
        with:
          name: StockManager-Arch
          path: dist/StockManager-arch-x64.tar.gz
          if-no-files-found: error

  release:
    needs: [build, build-arch]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## Descargas
            ### Windows
            - **stock-manager-server.exe** - Ejecutable para Windows 10/11
            
            ### Linux
            - **StockManager-ubuntu-x64.tar.gz** - Para Ubuntu/Debian y derivados
            - **StockManager-arch-x64.tar.gz** - Para Arch Linux/Manjaro y derivados
            
            ## Instalación
            **Windows:**
            ```bash
            # Descarga y ejecuta
            stock-manager-server.exe
            ```
            
            **Ubuntu/Debian:**
            ```bash
            # Instalar dependencias
            sudo apt-get install python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1
            
            # Extraer y ejecutar
            tar -xzf StockManager-ubuntu-x64.tar.gz
            chmod +x stock-manager-server
            ./stock-manager-server
            ```
            
            **Arch Linux/Manjaro:**
            ```bash
            # Instalar dependencias
            sudo pacman -S python-gobject gtk3 webkit2gtk-4.1
            
            # Extraer y ejecutar
            tar -xzf StockManager-arch-x64.tar.gz
            chmod +x stock-manager-server
            ./stock-manager-server
            ```
            
            **Fedora/RHEL:**
            ```bash
            # Instalar dependencias
            sudo dnf install python3-gobject gtk3 webkit2gtk4.1
            
            # Usar el tarball de Ubuntu
            tar -xzf StockManager-ubuntu-x64.tar.gz
            chmod +x stock-manager-server
            ./stock-manager-server
            ```
            
            ## Notas
            - Descarga el archivo correspondiente a tu distribución Linux para mejor compatibilidad
            - Si tu distro no está listada, prueba primero con el build de Ubuntu
            - El ejecutable debe tener permisos de ejecución (`chmod +x`)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}